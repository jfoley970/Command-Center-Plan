# Command Center on the Linux server.
#
#   cd deploy && cp .env.example .env   # fill it in
#   openssl rand -hex 32 > secrets/cc-secret-key && chmod 600 secrets/cc-secret-key
#   docker compose up -d --build
#
# Caddy is the only thing that listens on the network: on PUBLIC_ADDRESS (the
# LAN address your edge NATs 80/443 to from the public IP block) and on the
# WireGuard address. cc-server is never published; every request reaches it
# through Caddy and Authentik sign-in. The WireGuard endpoint (the admin path)
# runs on the host or the edge router, not in this file.

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      # Port 80 only answers Let's Encrypt and redirects to HTTPS.
      - "${PUBLIC_ADDRESS:?set PUBLIC_ADDRESS in .env}:443:443"
      - "${PUBLIC_ADDRESS}:80:80"
      - "${WG_ADDRESS:?set WG_ADDRESS in .env}:443:443"
    environment:
      CC_PUBLIC_HOST: ${CC_PUBLIC_HOST:?set CC_PUBLIC_HOST in .env}
      CC_AUTH_HOST: ${CC_AUTH_HOST:?set CC_AUTH_HOST in .env}
      AUTH_OUTPOST: ${AUTH_OUTPOST:?set AUTH_OUTPOST in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
      ADMIN_RANGES: ${ADMIN_RANGES:?set ADMIN_RANGES in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - cc-server

  cc-server:
    build: ..
    restart: unless-stopped
    environment:
      # Caddy sets this after the auth service signs you in and strips it from client requests.
      CC_AUTH_HEADER: X-Authentik-Username
      CC_SECRET_KEY_FILE: /run/secrets/cc-secret-key
      TZ: ${TZ}
    secrets:
      - cc-secret-key
    volumes:
      - cc-data:/data
    # Not published: only Caddy reaches it on the compose network.
    expose:
      - "8484"

  # Local models. Needs the NVIDIA container toolkit on the host; start with
  # `docker compose --profile llm up -d` once the GPU is in.
  ollama:
    image: ollama/ollama
    profiles: ["llm"]
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    expose:
      - "11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

secrets:
  cc-secret-key:
    file: ./secrets/cc-secret-key

volumes:
  caddy-data:
  cc-data:
  ollama:
