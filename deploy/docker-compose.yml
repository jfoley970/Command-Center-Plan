# Command Center on the Linux server.
#
#   cd deploy && cp .env.example .env   # fill it in
#   openssl rand -hex 32 > secrets/cc-secret-key && chmod 600 secrets/cc-secret-key && sudo chown 10001 secrets/cc-secret-key
#   docker compose up -d --build
#
# Caddy is the only thing that listens on the network: on PUBLIC_ADDRESS (the
# LAN address your edge NATs 80/443 to from the public IP block) and on the
# WireGuard address. cc-server is never published; every request reaches it
# through Caddy and Authentik sign-in. The WireGuard endpoint (the admin path)
# runs on the host or the edge router, not in this file.

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      # Port 80 only answers Let's Encrypt and redirects to HTTPS.
      - "${PUBLIC_ADDRESS:?set PUBLIC_ADDRESS in .env}:443:443"
      - "${PUBLIC_ADDRESS}:80:80"
      - "${WG_ADDRESS:?set WG_ADDRESS in .env}:443:443"
    environment:
      CC_PUBLIC_HOST: ${CC_PUBLIC_HOST:?set CC_PUBLIC_HOST in .env}
      CC_AUTH_HOST: ${CC_AUTH_HOST:?set CC_AUTH_HOST in .env}
      AUTH_OUTPOST: ${AUTH_OUTPOST:?set AUTH_OUTPOST in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
      ADMIN_RANGES: ${ADMIN_RANGES:?set ADMIN_RANGES in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - cc-server

  cc-server:
    build: ..
    restart: unless-stopped
    environment:
      # Caddy sets this after the auth service signs you in and strips it from client requests.
      CC_AUTH_HEADER: X-Authentik-Username
      CC_SECRET_KEY_FILE: /run/secrets/cc-secret-key
      # Local AI. Harmless when Ollama isn't running: the Local AI card says so.
      CC_OLLAMA_URL: http://ollama:11434
      TZ: ${TZ}
    secrets:
      - cc-secret-key
    volumes:
      - cc-data:/data
    # Not published: only Caddy reaches it on the compose network.
    expose:
      - "8484"

  # Local models for the Local AI provider. Turn on with COMPOSE_PROFILES=llm in
  # .env; add docker-compose.gpu.yml to COMPOSE_FILE once the NVIDIA driver and
  # container toolkit are on the host. Never published and not in the
  # Caddyfile: only cc-server talks to it, over the compose network.
  ollama:
    image: ollama/ollama
    profiles: ["llm"]
    restart: unless-stopped
    environment:
      # Keep a model loaded for 30 minutes after use so the next ask is quick.
      OLLAMA_KEEP_ALIVE: 30m
      # One model in memory at a time; an 8 GB card can't hold two 8B models.
      OLLAMA_MAX_LOADED_MODELS: 1
    volumes:
      - ollama:/root/.ollama
    expose:
      - "11434"

secrets:
  cc-secret-key:
    file: ./secrets/cc-secret-key

volumes:
  caddy-data:
  cc-data:
  ollama:
