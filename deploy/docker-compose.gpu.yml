# Gives Ollama the NVIDIA GPU. Needs the NVIDIA driver and the NVIDIA container
# toolkit on the host (deploy/README.md, "Local AI"). Turn on in .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.gpu.yml
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
